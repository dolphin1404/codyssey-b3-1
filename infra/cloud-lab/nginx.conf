# Included inside nginx http {} (EC2 and the local Docker check share this file).
# Public showcase proxy only; account/reader/admin paths go to the HTTPS origin.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host cbnu-clip-it.vercel.app;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_name cbnu-clip-it.vercel.app;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_redirect https://cbnu-clip-it.vercel.app/ /;

    # Health is served locally, even when Vercel or the application is unavailable.
    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    location = / {
        limit_except GET { deny all; }
        proxy_pass https://cbnu-clip-it.vercel.app;
    }

    # Homepage data: GET/HEAD only, with no cookies or authorization forwarded.
    location = /api/works {
        limit_except GET { deny all; }
        proxy_pass https://cbnu-clip-it.vercel.app;
    }

    location ^~ /_next/static/ {
        limit_except GET { deny all; }
        proxy_pass https://cbnu-clip-it.vercel.app;
    }

    location = /_next/image {
        limit_except GET { deny all; }
        proxy_pass https://cbnu-clip-it.vercel.app;
    }

    location ~ ^/(favicon\.ico|[^/]+\.(svg|png|jpe?g|webp|gif|woff2?))$ {
        limit_except GET { deny all; }
        proxy_pass https://cbnu-clip-it.vercel.app;
    }

    # Fixed HTTPS host; preserve path/query without permitting an open redirect.
    location / {
        return 308 https://cbnu-clip-it.vercel.app$request_uri;
    }
}
